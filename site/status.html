<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PythonOS - Build status</title>
<meta name="description" content="The latest PythonOS release, whether each platform built, and download counts.">
<meta name="theme-color" content="#0b0e15" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6fb" media="(prefers-color-scheme: light)">
<script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to the content</a>
<header class="bar">
  <div class="wrap">
    <a class="brand" href="./"><span class="logo" aria-hidden="true">&gt;_</span>PythonOS</a>
    <nav aria-label="Main">
      <a href="./">Download</a>
      <a href="status.html" aria-current="page">Build status</a>
      <a class="opt" href="https://github.com/Kalmai221/PythonOS">GitHub</a>
      <button class="icon-btn" id="theme" type="button" aria-pressed="false" aria-label="Switch theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>

<main id="main" class="wrap" style="padding-block: 40px 72px">
  <h1 class="title" style="font-size:clamp(2rem,5vw,3rem);margin-bottom:6px">Build status</h1>
  <p class="muted" id="stamp" style="margin-bottom:24px">Loading…</p>

  <div class="banner" id="banner" role="status" aria-live="polite">
    <span class="orb" aria-hidden="true"></span>
    <div><h2 id="b-title">Checking the latest build…</h2><p id="b-sub"></p></div>
    <button class="btn ghost" id="refresh" type="button">Refresh</button>
  </div>
  <div class="jobs" id="jobs" aria-label="Steps of the latest build"></div>

  <section style="margin-top:44px">
    <h2 style="margin-bottom:14px;font-size:1.4rem">Latest release</h2>
    <div class="kpis" id="kpis"></div>
  </section>

  <section style="margin-top:36px">
    <h2 style="margin-bottom:14px;font-size:1.4rem">Recent builds</h2>
    <div class="card" style="padding:8px 14px;overflow-x:auto"><table class="list" id="runs"><caption class="sr">Recent builds</caption></table></div>
  </section>

  <section style="margin-top:36px">
    <h2 style="margin-bottom:6px;font-size:1.4rem">Downloads</h2>
    <p class="muted" style="margin-bottom:16px">Counted by GitHub from the release files. Nothing is tracked inside PythonOS.</p>
    <div class="card"><div class="bars" id="downloads"></div></div>
  </section>
</main>

<footer><div class="wrap"><span>PythonOS · <a href="./">download</a> · <a href="https://github.com/Kalmai221/PythonOS/actions">all builds on GitHub</a></span></div></footer>

<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var P = window.PyOS;
  var $ = function (id) { return document.getElementById(id); };
  function state(r) { return r.status === "completed" ? (r.conclusion || "other") : "running"; }
  function label(s) { return { success: "passed", failure: "failed", cancelled: "cancelled", timed_out: "timed out", running: "running", skipped: "skipped" }[s] || s; }
  function pill(r) { var s = state(r); return "<span class='pill " + s + "'>" + label(s) + "</span>"; }
  function bust() { try { Object.keys(sessionStorage).forEach(function (k) { if (k.indexOf("gh:") === 0) sessionStorage.removeItem(k); }); } catch (e) {} }

  function load() {
    $("stamp").textContent = "Loading…";
    P.api("actions/workflows/build-os.yml/runs?per_page=8").then(function (data) {
      var runs = data.workflow_runs || [];
      if (!runs.length) throw new Error("no builds yet");
      var run = runs[0], s = state(run);
      var b = $("banner");
      b.className = "banner " + (s === "success" ? "ok" : s === "running" ? "run" : "bad");
      $("b-title").textContent = s === "success" ? "The latest build passed" : s === "running" ? "A build is running" : "The latest build did not pass";
      $("b-sub").innerHTML = "Run #" + run.run_number + " for <b>" + P.esc(run.head_branch) + "</b> · " + P.when(run.created_at) + " · <a href='" + run.html_url + "'>open on GitHub</a>";
      $("runs").innerHTML = "<tr><th scope='col'>Run</th><th scope='col'>For</th><th scope='col'>When</th><th scope='col'>Result</th></tr>" + runs.map(function (r) {
        return "<tr><td><a href='" + r.html_url + "'>#" + r.run_number + "</a></td><td>" + P.esc(r.head_branch) + "</td><td>" + P.when(r.created_at) + "</td><td>" + pill(r) + "</td></tr>";
      }).join("");
      return P.api("actions/runs/" + run.id + "/jobs?per_page=60");
    }).then(function (data) {
      $("jobs").innerHTML = data.jobs.map(function (j) {
        var s = state(j);
        return "<div class='job " + s + "'><span class='led' aria-hidden='true'></span><span>" + P.esc(j.name) + "</span><span class='st'>" + label(s) + "</span></div>";
      }).join("");
      $("stamp").textContent = "Updated " + new Date().toLocaleTimeString();
    }).catch(function (e) {
      $("b-title").textContent = "Could not load the build";
      $("b-sub").innerHTML = "<span class='err'>" + P.esc(e.message) + "</span>";
      $("stamp").textContent = "";
    });

    P.api("releases?per_page=30").then(function (rels) {
      var total = 0, rows = [];
      rels.forEach(function (rel) { rel.assets.forEach(function (a) { total += a.download_count; rows.push({ n: a.name, r: rel.tag_name, d: a.download_count }); }); });
      var latest = rels[0];
      $("kpis").innerHTML = latest ? "<div class='kpi'><b>" + P.esc(latest.tag_name) + "</b><span>latest release</span></div>" +
        "<div class='kpi'><b>" + latest.assets.length + "</b><span>files in it</span></div>" +
        "<div class='kpi'><b>" + total.toLocaleString() + "</b><span>downloads in total</span></div>" +
        "<div class='kpi'><b>" + rels.length + "</b><span>releases</span></div>" : "";
      rows.sort(function (a, b) { return b.d - a.d; });
      var top = rows.slice(0, 8), max = Math.max.apply(null, top.map(function (r) { return r.d; }).concat([1]));
      $("downloads").innerHTML = top.length ? top.map(function (r) {
        return "<div class='bar-row'><span title='" + P.esc(r.n) + "'>" + P.esc(r.n) + " <span class='muted'>" + P.esc(r.r) + "</span></span><span class='track'><span class='fill' style='display:block;width:" + Math.max(2, r.d / max * 100) + "%'></span></span><b>" + r.d + "</b></div>";
      }).join("") : "<span class='muted'>No downloads yet.</span>";
    }).catch(function (e) { $("kpis").innerHTML = ""; $("downloads").innerHTML = "<span class='err'>" + P.esc(e.message) + "</span>"; });
  }
  $("refresh").addEventListener("click", function () { bust(); load(); });
  load();
});
</script>
</body>
</html>
