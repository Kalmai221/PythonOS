name: Use the translations of this build
description: Puts the pyos/locales_auto.py made by the "translate" job over the checked-out one, so the package carries the newest Spanish, French and German.
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      continue-on-error: true            # without it the committed pyos/locales_auto.py is used, which is always safe
      with:
        name: locales-auto
        path: ${{ runner.temp }}/locales-auto
    - shell: bash
      run: |
        if [ -f "$RUNNER_TEMP/locales-auto/locales_auto.py" ]; then
          cp "$RUNNER_TEMP/locales-auto/locales_auto.py" pyos/locales_auto.py
          echo "Using the translations made in this run."
        else
          echo "No translations from this run: using the committed pyos/locales_auto.py."
        fi
