name: Test

# Runs on every push to main and every pull request: the lockdown audit, the catalog index check and the smoke test
# (starts PythonOS in a scratch copy and runs real commands) on Linux and Windows.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Lockdown audit
        run: python tools/audit_lockdown.py
      - name: Catalog index is current
        if: runner.os == 'Linux'
        run: |
          python tools/build_index.py
          git diff --exit-code online_packages/index.json
      - name: Smoke test
        run: python tools/smoke_test.py
