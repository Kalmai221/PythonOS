name: Build PythonOS

# Builds the Linux, Windows, Android and ISO packages from OS_Export/.
#   - Run it by hand from the Actions tab ("Run workflow"), or
#   - push a tag like v1.2.0 to also publish everything as a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # v1.2.0 for tags, "dev" for manual runs
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}

jobs:
  linux:
    name: Linux (.tar.gz and .deb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: bash OS_Export/Linux/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: pythonos-linux
          path: |
            dist/linux/*.tar.gz
            dist/linux/*.deb

  windows:
    name: Windows (portable zip and installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Make sure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build
        shell: pwsh
        run: ./OS_Export/Windows/build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: pythonos-windows
          path: |
            dist/windows/*.zip
            dist/windows/*.exe
            !dist/windows/PythonOS/**

  android:
    name: Android (APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Must match chaquopy { version } in app/build.gradle.kts: Chaquopy runs a Python of the
          # same version on the build machine to install the app's pip packages.
          python-version: "3.13"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Add the bootstrap script to the app
        # The app downloads the OS from the latest release on first launch; it only ships this script.
        run: cp OS_Export/bootstrap.py OS_Export/Android/app/src/main/python/bootstrap.py
      - name: Prepare the signing key
        env:
          # Optional repository secrets. Without them a throwaway key is generated, which gives an
          # installable APK, but APKs from different runs cannot be installed over each other.
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
            STORE_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$SECRET_KEY_ALIAS"
            KEY_PASS="${SECRET_KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "No signing secrets set - generating a throwaway key."
            STORE_PASS=android
            ALIAS=pythonos
            KEY_PASS=android
            keytool -genkeypair -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$ALIAS" \
              -keypass "$KEY_PASS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PythonOS"
          fi
          {
            echo "ANDROID_KEYSTORE_FILE=$KEYSTORE"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
      - name: Build the APK
        working-directory: OS_Export/Android
        run: |
          gradle assembleRelease --no-daemon \
            -PversionName="${VERSION#v}" -PversionCode="${{ github.run_number }}"
      - name: Name the APK
        run: |
          mkdir -p dist/android
          cp OS_Export/Android/app/build/outputs/apk/release/*.apk "dist/android/PythonOS-${VERSION#v}-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: pythonos-android
          path: dist/android/*.apk

  iso:
    name: ISO (bootable live image)
    runs-on: ubuntu-24.04
    # A stuck mirror or mkimage step must not hold up the release for hours (default is 6 h)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: bash OS_Export/ISO/build-iso.sh
      - uses: actions/upload-artifact@v7
        with:
          name: pythonos-iso
          path: dist/iso/*.iso

  core:
    name: Core update package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # pythonos-core-<version>.zip + core-manifest.json: installed copies of PythonOS (every
      # export) download these from the latest release to update their own core files.
      - run: python OS_Export/make_core.py
      - uses: actions/upload-artifact@v7
        with:
          name: pythonos-core
          path: |
            dist/core/*.zip
            dist/core/core-manifest.json

  release:
    name: Publish release
    # The core update package is what installed copies update from, so it gates the release;
    # a platform build that failed is simply missing from the release.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.core.result == 'success' }}
    needs: [linux, windows, android, iso, core]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
