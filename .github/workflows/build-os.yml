name: Build PythonOS

# Builds the Linux, Windows, Android, ISO (full and minimal), virtual-machine and Docker packages from OS_Export/.
#   - Run it by hand from the Actions tab ("Run workflow"): builds everything, publishes nothing.
#   - Push a tag like v1.2.0 to also publish a GitHub release (with SHA256SUMS, a signature and build attestations).
#
# Not rebuilding what has not changed (see OS_Export/plan.py):
#   1. an export whose inputs did not change since the previous release links to (and re-attaches) the old file;
#   2. an export that an EARLIER RUN OF THE SAME VERSION already built with the same inputs (for example the run that failed
#      because the ISO broke) is taken from that run's Actions artifact. After a fix, only what failed is built again.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write        # publish the release
  actions: read          # look for artifacts of earlier runs
  id-token: write        # keyless signing (sigstore) of the release checksums
  attestations: write    # build provenance
  packages: write        # the Docker image

env:
  # v1.2.0 for tags, "dev" for manual runs
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}

jobs:
  plan:
    name: Plan (what changed since the last release or the last run?)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      android: ${{ steps.plan.outputs.android }}
      android_fp: ${{ steps.plan.outputs.android_fp }}
      windows: ${{ steps.plan.outputs.windows }}
      windows_fp: ${{ steps.plan.outputs.windows_fp }}
      linux: ${{ steps.plan.outputs.linux }}
      linux_fp: ${{ steps.plan.outputs.linux_fp }}
      iso: ${{ steps.plan.outputs.iso }}
      iso_fp: ${{ steps.plan.outputs.iso_fp }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: plan
        run: python OS_Export/plan.py --out plan.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: pythonos-plan
          path: plan.json

  checks:
    name: Checks (lockdown audit, dependency vulnerabilities, smoke test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            boot-requirements.txt
      - name: Lockdown audit (fails if OS code can spawn commands or run code unreviewed)
        run: python tools/audit_lockdown.py
      - name: Catalog index is current
        run: |
          python tools/build_index.py
          git diff --exit-code online_packages/index.json
      - name: Smoke test (starts the OS and runs real commands)
        run: |
          pip install -r requirements.txt
          python tools/smoke_test.py
      - name: Known vulnerabilities in the Python dependencies
        # pip-audit fails when a dependency has a published vulnerability. Set the repository variable ALLOW_VULNERABLE=true to
        # publish anyway (and fix it soon). The ISO's Alpine packages are always the newest of the 3.19 repository at build time.
        continue-on-error: ${{ vars.ALLOW_VULNERABLE == 'true' }}
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r boot-requirements.txt

  linux:
    name: Linux (.tar.gz, .deb, Arch .pkg.tar.zst, .rpm)
    needs: [plan, translate]
    if: needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/translated
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tools for the Arch and RPM packages (a failure here only skips those two)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd rpm ruby ruby-dev build-essential
          sudo gem install --no-document fpm
      - run: bash OS_Export/Linux/build.sh
      - name: Smoke test (the staged OS, as the package would install it)
        run: |
          pip install -r requirements.txt
          python OS_Export/stage.py "$RUNNER_TEMP/payload" --export linux
          python tools/smoke_test.py --dir "$RUNNER_TEMP/payload"
      - uses: actions/upload-artifact@v7
        with:
          name: export-linux-${{ needs.plan.outputs.linux_fp }}-${{ needs.plan.outputs.version }}
          path: |
            dist/linux/*.tar.gz
            dist/linux/*.deb
            dist/linux/*.pkg.tar.zst
            dist/linux/*.rpm

  windows:
    name: Windows ${{ matrix.arch }} (portable zip and installer)
    needs: [plan, translate]
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]       # arm64 is assembled here from ARM64 Python and wheels (nothing needs an ARM machine)
    # The x64 build must pass. ARM64 is attached when it builds and never holds a release back.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/translated
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Make sure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build
        shell: pwsh
        run: ./OS_Export/Windows/build.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: export-windows-${{ matrix.arch == 'arm64' && 'arm64-' || '' }}${{ needs.plan.outputs.windows_fp }}-${{ needs.plan.outputs.version }}
          path: |
            dist/windows/*.zip
            dist/windows/*.exe
            !dist/windows/PythonOS/**

  android:
    name: Android (APKs)
    needs: [plan, translate]
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/translated
      - uses: actions/setup-python@v7
        with:
          # Must match chaquopy { version } in app/build.gradle.kts: Chaquopy runs a Python of the
          # same version on the build machine to install the app's pip packages.
          python-version: "3.13"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6        # also caches Gradle's downloads between runs
        with:
          gradle-version: "8.9"
      - name: Add the bootstrap script to the app
        # The app downloads the OS from the latest release on first launch; it only ships this script.
        run: |
          cp OS_Export/bootstrap.py OS_Export/Android/app/src/main/python/bootstrap.py
          python OS_Export/stage.py --write-export android OS_Export/Android/app/src/main/python/pyos_export.py
      - name: Prepare the signing key
        env:
          # Optional repository secrets. Without them a throwaway key is generated, which gives an
          # installable APK, but APKs from different runs cannot be installed over each other.
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          if [ -z "$KEYSTORE_B64" ] && [ -f OS_Export/Android/signing.sha256 ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "::error::A release APK must be signed with the permanent key (its fingerprint is pinned in OS_Export/Android/signing.sha256), but the signing secrets are missing. Run: python tools/android_signing_setup.py --upload"
            exit 1
          fi
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
            STORE_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$SECRET_KEY_ALIAS"
            KEY_PASS="${SECRET_KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "::warning::No signing secrets set - generating a throwaway key. This APK cannot be installed over (or be updated by) an APK from another run. See tools/android_signing_setup.py"
            STORE_PASS=android
            ALIAS=pythonos
            KEY_PASS=android
            keytool -genkeypair -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$ALIAS" \
              -keypass "$KEY_PASS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PythonOS"
          fi
          {
            echo "ANDROID_KEYSTORE_FILE=$KEYSTORE"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
      - name: Build the APKs (one per processor type) and the small installer app
        working-directory: OS_Export/Android
        run: |
          gradle assembleRelease --no-daemon \
            -PversionName="${VERSION#v}" -PversionCode="${{ github.run_number }}"
      - name: Check the APK signatures
        run: |
          # Android only installs an update over an installed app when both carry the same key. Every APK of one build must share a key, and a
          # release must use the permanent key whose fingerprint is pinned in the repository.
          APKSIGNER="$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -n1)"
          PIN=""
          [ -f OS_Export/Android/signing.sha256 ] && PIN="$(tr -d ' \r\n' < OS_Export/Android/signing.sha256)"
          FIRST=""
          for apk in $(find OS_Export/Android/app/build/outputs/apk OS_Export/Android/installer/build/outputs/apk -name "*release*.apk"); do
            SUM="$("$APKSIGNER" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: *//p' | head -n1)"
            echo "$apk is signed with $SUM"
            if [ -n "$FIRST" ] && [ "$SUM" != "$FIRST" ]; then echo "::error::the APKs of this build are not all signed with one key"; exit 1; fi
            FIRST="$SUM"
          done
          [ -n "$FIRST" ] || { echo "::error::no signed APK was found"; exit 1; }
          if [ -n "$PIN" ] && [ "$FIRST" != "$PIN" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::the APKs are signed with $FIRST, not the pinned release key $PIN, so users could not update to them"
              exit 1
            fi
            echo "::warning::these APKs are not signed with the pinned release key ($PIN): fine for testing, not for a release"
          fi
      - name: Name the APKs
        run: |
          mkdir -p dist/android
          OUT=OS_Export/Android/app/build/outputs/apk
          find "$OUT" -name "*.apk" -print
          V="${VERSION#v}"
          cp "$(find "$OUT" -name "*arm64*release*.apk" | head -n1)" "dist/android/PythonOS-$V-android-arm64-v8a.apk"
          cp "$(find "$OUT" -name "*x64*release*.apk" | head -n1)" "dist/android/PythonOS-$V-android-x86_64.apk"
          cp "$(find OS_Export/Android/installer/build/outputs/apk -name "*release*.apk" | head -n1)" "dist/android/PythonOS-$V-android-installer.apk"
          ls -la dist/android
      - uses: actions/upload-artifact@v7
        with:
          name: export-android-${{ needs.plan.outputs.android_fp }}-${{ needs.plan.outputs.version }}
          path: dist/android/*.apk

  iso:
    name: ISO ${{ matrix.arch }} (${{ matrix.variant }})
    needs: [plan, translate]
    if: needs.plan.outputs.iso == 'true'
    runs-on: ${{ matrix.runner }}
    # The PC (x86_64) images must build. The 64-bit ARM (aarch64) images are built on GitHub's ARM runners and are attached
    # when they build; a problem there never holds a release back.
    continue-on-error: ${{ matrix.arch == 'aarch64' }}
    strategy:
      fail-fast: false          # a finished variant is kept as an artifact and reused if the other one has to be re-run
      matrix:
        include:
          - { arch: x86_64,  variant: full,    runner: ubuntu-24.04 }
          - { arch: x86_64,  variant: minimal, runner: ubuntu-24.04 }
          - { arch: aarch64, variant: full,    runner: ubuntu-24.04-arm }
          - { arch: aarch64, variant: minimal, runner: ubuntu-24.04-arm }
    # A stuck mirror or mkimage step must not hold up the release for hours (default is 6 h)
    timeout-minutes: 45
    env:
      ISO_VARIANT: ${{ matrix.variant }}
      ISO_ARCH: ${{ matrix.arch }}
      ISO_APK_CACHE: ${{ github.workspace }}/.cache/apk
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/translated
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lockdown audit (fails if OS code can spawn commands or run code unreviewed)
        run: python tools/audit_lockdown.py
      - name: Package names exist in Alpine (a misspelt name would fail the build late)
        run: python OS_Export/ISO/check_packages.py
      - uses: actions/cache@v4
        with:
          path: .cache/apk
          key: alpine-apk-${{ matrix.arch }}-${{ matrix.variant }}-${{ hashFiles('OS_Export/ISO/in-container.sh', 'OS_Export/ISO/mkimg.pythonos.sh') }}
          restore-keys: alpine-apk-${{ matrix.arch }}-${{ matrix.variant }}-
      - run: bash OS_Export/ISO/build-iso.sh
      - name: Size report (what the ISO is made of, in the job summary; informational only)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq xorriso
          ISO="$(ls dist/iso/*.iso | head -n1)"
          mkdir -p "$RUNNER_TEMP/isoview"
          xorriso -osirrox on -indev "$ISO" -extract / "$RUNNER_TEMP/isoview" >/dev/null 2>&1
          {
            echo "### ISO ${{ matrix.arch }} (${{ matrix.variant }}): $(du -h "$ISO" | cut -f1)"
            echo "Top-level folders:"; echo '```'; du -sh "$RUNNER_TEMP"/isoview/* | sed "s|$RUNNER_TEMP/isoview/||" | sort -rh; echo '```'
            echo "Files in boot/:"; echo '```'; find "$RUNNER_TEMP/isoview/boot" -maxdepth 1 -type f -printf '%s %f\n' | sort -rn | awk '{printf "%7.1f MB  %s\n", $1/1048576, $2}'; echo '```'
            for m in "$RUNNER_TEMP"/isoview/boot/modloop-*; do
              [ -f "$m" ] || continue
              sudo apt-get install -y -qq squashfs-tools >/dev/null 2>&1
              echo "Inside $(basename "$m") (uncompressed size per folder; the file on the disc is compressed):"; echo '```'
              unsquashfs -d "$RUNNER_TEMP/modloop" -f "$m" >/dev/null 2>&1
              du -sm "$RUNNER_TEMP"/modloop/modules/*/kernel/* 2>/dev/null | sort -rn | head -12 | sed "s|$RUNNER_TEMP/modloop/||"
              du -sm "$RUNNER_TEMP"/modloop/modules/*/* "$RUNNER_TEMP"/modloop/firmware 2>/dev/null | sort -rn | head -8 | sed "s|$RUNNER_TEMP/modloop/||"
              echo '```'
            done
            echo "The 30 biggest packages on the disc:"; echo '```'
            find "$RUNNER_TEMP/isoview" -name '*.apk' -printf '%s %f\n' | sort -rn | head -30 | awk '{printf "%7.2f MB  %s\n", $1/1048576, $2}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Virtual machine images (full x86_64 image only)
        if: matrix.variant == 'full' && matrix.arch == 'x86_64'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-utils zip
          V="$(python3 OS_Export/stage.py --print-version)"      # the version in the ISO file name ("1.0.12-dev" for a manual run)
          bash OS_Export/ISO/vm/make-images.sh "dist/iso/pythonos-$V-x86_64.iso" "$V" dist/iso
          ls -la dist/iso
      - uses: actions/upload-artifact@v7
        with:
          name: export-iso-${{ matrix.arch == 'aarch64' && 'aarch64-' || '' }}${{ matrix.variant }}-${{ needs.plan.outputs.iso_fp }}-${{ needs.plan.outputs.version }}
          path: dist/iso/*

  translate:
    name: Translations (es, fr, de)
    # The same translating as the Translations workflow, so a release always carries translated messages even when that workflow's pull
    # request has not been merged yet. It never fails the build: if anything goes wrong, the committed pyos/locales_auto.py is used.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Keep the Argos models between runs
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-models-${{ hashFiles('tools/translate_ci.py') }}
          restore-keys: argos-models-
      - name: Translate what is missing
        continue-on-error: true
        env:
          ARGOS_DEVICE_TYPE: cpu
        run: |
          pip install -r requirements.txt argostranslate
          cp pyos/locales_auto.py "$RUNNER_TEMP/locales_auto.before.py"
          python tools/translate_ci.py
          python tools/test_translations.py
          python tools/test_translate_ci.py
      - name: Keep the result only if it is sound
        run: |
          if ! python tools/test_translations.py >/dev/null 2>&1; then
            echo "The translations did not pass their checks: using the committed file."
            cp "$RUNNER_TEMP/locales_auto.before.py" pyos/locales_auto.py || git checkout -- pyos/locales_auto.py
          fi
          mkdir -p dist/locales && cp pyos/locales_auto.py dist/locales/locales_auto.py
      - uses: actions/upload-artifact@v7
        with:
          name: locales-auto
          path: dist/locales/locales_auto.py

  core:
    name: Core update package
    needs: [plan, translate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/translated
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: pythonos-plan
          path: planfile
      # pythonos-core-<version>.zip + core-manifest.json: installed copies of PythonOS (every
      # export) download these from the latest release to update their own core files. The plan tells
      # make_core which exports were reused, so the manifest keeps pointing at their old files.
      - run: python OS_Export/make_core.py
        env:
          PLAN_FILE: ${{ github.workspace }}/planfile/plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: pythonos-core
          path: |
            dist/core/*.zip
            dist/core/core-manifest.json

  docker:
    name: Docker image (ghcr.io)
    needs: [plan, checks, translate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    continue-on-error: true       # a registry hiccup must not hold back the release
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/translated
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python OS_Export/stage.py dist/docker/payload
          cp tools/smoke_test.py dist/docker/tools_smoke.py
      - uses: docker/setup-qemu-action@v3         # lets this x64 machine build the arm64 image too
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build, check and push
        run: |
          V="${VERSION#v}"
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr 'A-Z' 'a-z')"
          cp OS_Export/Docker/Dockerfile OS_Export/Docker/entrypoint.sh dist/docker/
          # build and check the amd64 image first, then publish one multi-architecture image (amd64 and arm64: PCs, Raspberry Pi, Apple silicon)
          docker buildx build --load --platform linux/amd64 -t "$IMAGE:$V" dist/docker
          docker run --rm "$IMAGE:$V" python /opt/tools_smoke.py --dir /opt/pythonos
          # a volume keeps accounts, files and settings: write a marker through one container, read it back in the next
          docker volume create pyos-check >/dev/null
          docker run --rm -v pyos-check:/data "$IMAGE:$V" sh -c 'echo kept > /opt/pythonos/files/marker.txt'
          docker run --rm -v pyos-check:/data "$IMAGE:$V" sh -c 'test "$(cat /opt/pythonos/files/marker.txt)" = kept'
          docker buildx build --push --platform linux/amd64,linux/arm64 -t "$IMAGE:$V" -t "$IMAGE:latest" dist/docker

  release:
    name: Publish release
    # The core package is what installed copies update from, so it must succeed; an export that had to be
    # built must succeed too (the manifest links to its files). Reused exports are simply skipped jobs.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.core.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    needs: [plan, checks, linux, windows, android, iso, core, translate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Re-attach the files of exports that were not rebuilt
        run: |
          python OS_Export/plan.py --fetch-reused artifacts/plan.json artifacts
          cp artifacts/plan.json plan.json
          rm artifacts/plan.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Release notes (from CHANGELOG.md) and checksums
        run: |
          python OS_Export/release_notes.py --plan plan.json --files artifacts --out body.md --catalog artifacts/release-catalog.json
          cd artifacts
          ls -la
          sha256sum $(ls | grep -v '^SHA256SUMS' | sort) > SHA256SUMS
          cat SHA256SUMS
      - name: Build provenance for every file
        continue-on-error: true      # signing services being down must not lose the release; the checksums above are still published
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*
      - uses: sigstore/cosign-installer@v3
        continue-on-error: true
      - name: Sign the checksums (keyless, with this workflow's identity)
        continue-on-error: true
        run: cosign sign-blob --yes --bundle artifacts/SHA256SUMS.sigstore.json artifacts/SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          body_path: body.md
          generate_release_notes: false
