name: Website

# Publishes site/ (the download page and the build status page) to GitHub Pages.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["site/**", "online_packages/index*.json", "online_packages/categories.json", ".github/workflows/site.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - name: Put the app catalog next to the pages (the App Library reads it; one request, same address)
        run: |
          mkdir -p site/data
          cp online_packages/index-api2.json site/data/catalog.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
