name: Security checks

# Weekly: known vulnerabilities in the Python dependencies, and the lockdown audit. Also runnable by hand.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/audit_lockdown.py
      - name: Known vulnerabilities (pip-audit)
        id: audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r boot-requirements.txt | tee audit.txt
      - name: Open an issue when something is found
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Vulnerable dependency found (weekly check)" \
            --label security --body "$(printf 'The weekly pip-audit run found known vulnerabilities:\n\n```\n%s\n```\n' "$(cat audit.txt)")" || true
          exit 1
